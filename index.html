
  <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte: Último Movimiento por Artículo y Almacén</title>
    <!-- Incluimos la librería SheetJS para procesar Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { font-size: 20px; color: #0056b3; }
        .controls { margin-bottom: 20px; padding: 15px; background: #eef2f5; border-radius: 6px; display: flex; gap: 15px; align-items: center; }
        input[type="file"] { border: 1px solid #ccc; padding: 5px; border-radius: 4px; background: white; }
        button { background-color: #0056b3; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #004494; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #downloadBtn { background-color: #28a745; }
        #downloadBtn:hover { background-color: #218838; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #0056b3; color: white; }
        .info { font-size: 13px; color: #555; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Análisis de Último Movimiento (SAP MM)</h1>
    
    <div class="controls">
        <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" />
        <button id="processBtn">Procesar Archivo</button>
        <button id="downloadBtn" disabled>Descargar Resultado Completo</button>
    </div>

    <div class="info" id="statusText">Carga un archivo de Excel para comenzar.</div>

    <table id="previewTable" style="display:none;">
        <thead>
            <tr>
                <th>Artículo</th>
                <th>Descripción</th>
                <th>Fe.contabilización</th>
                <th>Cl. Mov.</th>
                <th>Texto Cl. Mov.</th>
                <th>Almacén</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    let finalResultData = []; // Aquí guardaremos todo el resultado para descargar

    // Función robusta para convertir las fechas de SAP (DD.MM.YYYY, números de Excel, o Strings) a formato Date de JS
    function parseSAPDate(val) {
        if (!val) return new Date(0);
        if (val instanceof Date) return val;
        if (typeof val === 'number') return new Date(Math.round((val - 25569) * 86400 * 1000));
        
        let str = String(val).trim();
        // Si viene con formato SAP DD.MM.YYYY
        if (str.includes('.')) {
            let parts = str.split('.');
            if(parts.length === 3) return new Date(parts[2], parts[1] - 1, parts[0]);
        }
        // Si viene con formato DD/MM/YYYY
        if (str.includes('/')) {
            let parts = str.split('/');
            if(parts.length === 3) return new Date(parts[2], parts[1] - 1, parts[0]);
        }
        
        let parsed = new Date(str);
        return isNaN(parsed.getTime()) ? new Date(0) : parsed;
    }

    document.getElementById('processBtn').addEventListener('click', () => {
        const fileInput = document.getElementById('fileInput');
        if (!fileInput.files.length) {
            alert('Por favor, selecciona un archivo primero.');
            return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        document.getElementById('statusText').innerText = "Procesando...";

        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            
            // Tomamos la primera hoja
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            
            // Convertimos la hoja a JSON
            const jsonData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

            let groupedData = {};

            // Procesar y agrupar
            jsonData.forEach(row => {
                let articulo = row['Artículo'] || row['Articulo']; 
                let almacen = row['Almacén'] || row['Almacen'];
                let claseMov = row['Clase de movimiento'];
                let fechaOriginal = row['Fe.contabilización'] || row['Fe.contabilizacion'];
                
                if (!articulo) return; // Ignorar filas vacías

                // Llave compuesta: Artículo + Almacén + Clase Movimiento (Corregido el acento en la variable almacen)
                let key = `${articulo}_${almacen}_${claseMov}`;
                let dateValue = parseSAPDate(fechaOriginal);

                if (!groupedData[key]) {
                    groupedData[key] = { row: row, date: dateValue };
                } else {
                    // Si la fecha actual es mayor a la guardada, la reemplazamos
                    if (dateValue > groupedData[key].date) {
                        groupedData[key] = { row: row, date: dateValue };
                    }
                }
            });

            // Dar formato final para la exportación y vista previa
            finalResultData = Object.values(groupedData).map(item => {
                return {
                    "Artículo": item.row['Artículo'] || item.row['Articulo'],
                    "Texto breve de artículo": item.row['Texto breve de artículo'] || "",
                    "Fe.contabilización": item.row['Fe.contabilización'] || item.row['Fe.contabilizacion'],
                    "Clase de movimiento": item.row['Clase de movimiento'],
                    "Texto de clase-mov.": item.row['Texto de clase-mov.'],
                    "Almacén": item.row['Almacén'] || item.row['Almacen']
                };
            });

            // Renderizar Vista Previa (Solo los primeros 50 registros)
            renderPreview(finalResultData.slice(0, 50), finalResultData.length);
        };

        reader.readAsArrayBuffer(file);
    });

    function renderPreview(previewData, totalRecords) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; // Limpiar tabla

        previewData.forEach(row => {
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${row['Artículo']}</td>
                <td>${row['Texto breve de artículo']}</td>
                <td>${row['Fe.contabilización']}</td>
                <td>${row['Clase de movimiento']}</td>
                <td>${row['Texto de clase-mov.']}</td>
                <td>${row['Almacén']}</td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('previewTable').style.display = 'table';
        document.getElementById('statusText').innerHTML = `<strong>Éxito:</strong> Se procesaron ${totalRecords} registros únicos. Mostrando una vista previa de los primeros ${previewData.length}.`;
        
        // Habilitar descarga
        document.getElementById('downloadBtn').disabled = false;
    }

    // Botón de descarga para el archivo procesado
    document.getElementById('downloadBtn').addEventListener('click', () => {
        if(finalResultData.length === 0) return;

        // Crear una nueva hoja con el resultado final
        const newWorksheet = XLSX.utils.json_to_sheet(finalResultData);
        const newWorkbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(newWorkbook, newWorksheet, "Últimos Movimientos");

        // Descargar el archivo
        XLSX.writeFile(newWorkbook, "Reporte_Ultimo_Movimiento.xlsx");
    });
</script>

</body>
</html>
